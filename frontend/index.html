<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RescueGrid | AI-powered food rescue</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f5fc;--card:#fff;--line:#e2ddf0;--tx:#2a2545;--mut:#665f85;--g:#6b5bc7;--g2:#ece9fa;--am:#3db89a;--red:#d9534f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17142a;--card:#211d3a;--line:#353057;--tx:#ece9fa;--mut:#aaa4cc;--g:#7b6bd6;--g2:#2c2650}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17142a;--card:#211d3a;--line:#353057;--tx:#ece9fa;--mut:#aaa4cc;--g:#7b6bd6;--g2:#2c2650}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.o{background:none;color:var(--g);border:1.5px solid var(--g)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 12px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.back{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px}
.back:disabled{opacity:.35;cursor:default}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 28px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:var(--tx);padding:0;text-align:left}
.brand b{font:700 20px Fraunces,serif;display:block;line-height:1}.brand small{font-size:10px;color:var(--mut);letter-spacing:.04em}
.links{margin-left:auto;display:flex;gap:20px;align-items:center}.links a{color:var(--mut);cursor:pointer;text-decoration:none;font-weight:500}.links a:hover{color:var(--g)}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:56px 0 36px}
.hero h1{font-size:clamp(36px,5.5vw,60px)}.hero h1 em{color:var(--g);font-style:normal}
.hero p{font-size:17px;color:var(--mut);max-width:48ch;margin:16px 0 24px}.hero .btn{margin:0 10px 8px 0;padding:12px 22px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:12px 0 48px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-weight:600}.feat span{display:block;font-size:26px}
section.s{padding:36px 0}section.s h2{font-size:30px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.num{font:700 32px Fraunces,serif}.mut{color:var(--mut);font-size:13px}
.up{color:var(--g);font-size:12px;font-weight:600}
footer{border-top:1px solid var(--line);padding:24px 28px;color:var(--mut);font-size:13px;text-align:center;margin-top:30px}
.auth{display:grid;place-items:center;padding:30px 16px}.auth .card{width:100%;max-width:400px;padding:28px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{flex:1;background:none;border:0;padding:10px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent}.tabs .on{color:var(--g);border-color:var(--g)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
input,select,textarea{width:100%;margin-top:4px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.err{color:var(--red);font-size:13px;margin:0 0 10px}.ok{color:var(--g);font-weight:600}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside nav{margin-top:20px;flex:1;overflow-y:auto;min-height:0;padding-bottom:12px}aside nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;color:var(--mut);font-weight:500;margin-bottom:2px}
aside nav button.on{background:var(--g2);color:var(--g);font-weight:700}
.main{padding:22px 30px;min-width:0}.bar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}.bar h1{font-size:26px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700}
.row{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row.h{border:0;color:var(--mut);font-size:12px;font-weight:600}
.pill{display:inline-block;background:var(--g2);color:var(--g);font-weight:700;border-radius:99px;padding:2px 10px;font-size:13px}
.act{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.act:first-child{border:0}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.steps{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.steps span{padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:13px}.steps .on{background:var(--g);border-color:var(--g);color:#fff}
.chip{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 12px;margin-bottom:8px}.chip:hover{border-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}.chart div{flex:1;background:var(--g);border-radius:6px 6px 0 0;position:relative;min-height:4px}.chart i{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);font-style:normal}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(#6b5bc7 0 42%,#3db89a 42% 70%,#a79de6 70% 85%,#a6dccd 85% 93%,#cfcae6 93%);display:grid;place-items:center}.donut div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;text-align:center;line-height:1.2}
.bub{padding:12px 14px;border-radius:12px;margin-bottom:10px;max-width:85%}.bub.u{background:var(--g);color:#fff;margin-left:auto}.bub.a{background:var(--g2)}
.ov{position:fixed;inset:0;background:rgba(10,25,20,.5);display:grid;place-items:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:16px;padding:26px;max-width:400px;width:100%;text-align:center}.md h3{margin:8px 0}.md .btn{margin:6px 4px 0}
@media(max-width:820px){.hero,.cols,.g3,.g4,.feat{grid-template-columns:1fr 1fr}.hero,.cols{grid-template-columns:1fr}.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:8px;padding:10px}aside nav{display:flex;margin:0;gap:4px}aside nav button{white-space:nowrap;width:auto}aside .brand small,aside .out{display:none}.main{padding:16px}.row{grid-template-columns:1fr 1fr}.row.h{display:none}.links a{display:none}header.top{padding:10px 16px}.wrap{padding:0 16px}}
@media(max-width:520px){.g3,.g4,.feat,.two{grid-template-columns:1fr}}

/* Expansion pages reuse the original RescueGrid palette and components. */
.page-intro{color:var(--mut);max-width:72ch;margin:-6px 0 18px}.page-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stack{display:grid;gap:12px}.metric-note{font-size:12px;color:var(--mut);margin-top:6px}.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.map-panel{min-height:280px;background:var(--g2);border:1px solid var(--line);border-radius:14px;padding:20px}.fake-map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.fake-map .card{min-height:85px}.small-table{width:100%;border-collapse:collapse}.small-table td,.small-table th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.small-table th{color:var(--mut)}
@media(max-width:520px){.page-grid{grid-template-columns:1fr}.small-table{display:block;overflow:auto}}

/* Compact, expandable navigation groups; preserves the supplied lavender RescueGrid visual system. */
aside nav .nav-group{margin:5px 0}
aside nav .group-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;color:var(--tx);background:transparent;border:0;width:100%;text-align:left;padding:11px 12px;border-radius:10px}
aside nav .group-toggle:hover,aside nav .group-toggle[aria-expanded="true"]{background:var(--g2);color:var(--g)}
aside nav .group-toggle .group-icon{width:22px;display:inline-grid;place-items:center;margin-right:6px}
aside nav .group-toggle .chev{margin-left:auto;transition:transform .18s}
aside nav .group-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
aside nav .group-items{padding:3px 0 5px 12px}
aside nav .group-items[hidden]{display:none}
aside nav .group-items button{font-size:13px;padding:9px 10px;margin:2px 0}
aside nav .group-items button.on{box-shadow:inset 3px 0 var(--g)}
.dash-map{height:300px;border-radius:12px;overflow:hidden;background:var(--g2);border:1px solid var(--line)}
.dash-cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:16px}
.dash-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.dash-stat{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:13px}
.dash-stat strong{display:block;font:700 26px Fraunces,serif;margin:4px 0}
.dash-stat span{color:var(--mut);font-size:12px}
@media(max-width:1000px){.shell{grid-template-columns:205px 1fr}.dash-cols{grid-template-columns:1fr}.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.shell{display:block}aside{position:relative;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}aside nav{max-height:40vh;display:grid;grid-template-columns:1fr 1fr;gap:4px}.group-items{grid-column:1/-1}.main{padding:18px 14px}.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>
<body>
<div id="app"></div><div id="md"></div>

<script>
const API = ""; // Same-origin FastAPI serves this page and /donations.
const $ = (s, root=document) => root.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logo=(s=38)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 9v14c0 11-8 19-18 22C14 42 6 34 6 23V9z" fill="#6b5bc7"/><path d="M15 29c0-9 6-14 18-15 0 11-6 17-16 17z" fill="#fff"/><path d="M18 30 29 19" stroke="#6b5bc7" stroke-width="2" stroke-linecap="round"/><circle cx="33" cy="34" r="4" fill="#3db89a"/></svg>`;
const brand=(s=38)=>`<button class="brand" data-go="home">${logo(s)}<span><b>RescueGrid</b><small>AI-POWERED FOOD RESCUE</small></span></button>`;
const STATUS_LABEL={registered:"Registered",safety_review:"Safety review",safety_cleared:"Safety cleared",matched:"Matched",accepted:"Accepted",picked_up:"Picked up",completed:"Completed",rejected_unsafe:"Rejected as unsafe",cancelled:"Cancelled",expired:"Expired"};
const CAT_LABEL={cooked_meal:"Cooked meals",produce:"Fruits & vegetables",bakery:"Bakery items",dairy:"Dairy products",packaged:"Packaged food",beverage:"Beverages",other:"Other"};
const CAT_VALUE={"Cooked meals":"cooked_meal","Fruits & vegetables":"produce","Bakery items":"bakery","Dairy products":"dairy","Packaged food":"packaged","Beverages":"beverage","Other":"other"};
let user=null,page="home",stack=[],donations=[],recipients=[],matches=[],selectedDonation=null,err="",toastTimer=null;
const note='<p class="mut">Prototype data. Recipient profiles are synthetic; food-safety eligibility is handled by explicit rules, not AI.</p>';
function notify(message, bad=false){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}el.textContent=message;el.style.cssText=`position:fixed;right:20px;bottom:20px;z-index:99;background:${bad?"#a83232":"#276749"};color:white;padding:12px 16px;border-radius:10px;box-shadow:0 4px 18px #0002;max-width: min(90vw,500px)`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),4500)}
async function api(path, options={}){const response=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let body;try{body=await response.json()}catch{body={detail:response.statusText}}if(!response.ok){let detail=body.detail;throw new Error(Array.isArray(detail)?detail.map(x=>x.msg).join(", "):(detail||`Request failed (${response.status})`))}return body}
function modal(content){$("#md").innerHTML=content?`<div class="ov" data-close><div class="md">${content}</div></div>`:""}
function go(next){modal();if(next==="admin"&&user?.role!=="admin"){notify("Admin view is available only in the administrator demo role.",true);return}if(next==="find"&&!user){modal('<h3>Sign in to continue</h3><p class="mut">You can browse the public landing page without signing in.</p><button class="btn" data-go="login">Sign in</button><button class="btn o" data-x>Cancel</button>');return}if(next===page)return;stack.push(page);page=next;err="";render();scrollTo(0,0)}
function back(){if(stack.length){page=stack.pop();err="";render()}}
const bk=()=>`<button class="back" data-back ${stack.length?"":"disabled"}>← Back</button>`;
const dtLocal=(d)=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)};
const fmtDate=s=>{try{return new Date(s).toLocaleString()}catch{return s||"—"}};
const kg=d=>`${Number(d.quantity).toLocaleString(undefined,{maximumFractionDigits:2})} ${d.unit}`;
const badge=s=>`<span class="pill">${esc(STATUS_LABEL[s]||s)}</span>`;
function statusActions(d){
if(d.status==="matched")return `<button class="btn sm" data-status="${d.id}" data-next="accepted">Accept</button>`;
if(d.status==="accepted")return `<button class="btn sm" data-status="${d.id}" data-next="picked_up">Mark picked up</button>`;
if(d.status==="picked_up")return `<button class="btn sm" data-status="${d.id}" data-next="completed">Confirm handoff</button>`;
if(d.status==="safety_review")return `<button class="btn o sm" data-review="${d.id}">Review safety</button>`;
return "";
}
function donationCard(d, actions=null){actions = actions===null ? statusActions(d) : actions;return `<div class="act"><span style="font-size:24px">${({"cooked_meal":"🍲","produce":"🥦","bakery":"🥖","dairy":"🥛","packaged":"🥫","beverage":"🧃","other":"🍽️"})[d.category]||"🍽️"}</span><div style="flex:1;min-width:0"><b>${esc(d.food_name)}</b><div class="mut">${esc(CAT_LABEL[d.category]||d.category)} · ${esc(kg(d))} · Pickup ${esc(fmtDate(d.pickup_at))}</div><div class="mut">${esc(d.pickup_address)} · ${badge(d.status)}</div>${d.safety_note?`<div class="err">${esc(d.safety_note)}</div>`:""}</div>${actions}</div>`}
async function refresh(){try{donations=await api("/donations");return true}catch(e){notify("Could not load donations: "+e.message,true);return false}}
const P={
dashboard(){return `<div class="bar"><div><div class="mut">RESCUEGRID OVERVIEW</div><h1>Good food. Better futures.</h1><p class="page-intro">Your live rescue operations at a glance. Map pins depend on available, verified pickup addresses.</p></div><div class="who"><span>${esc(user?.name||"Community member")}</span><span class="av">${esc((user?.name||"RG").split(/\\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase())}</span></div></div><div id="dash-metrics" class="dash-stats"><div class="dash-stat"><span>Registered donations</span><strong>—</strong></div><div class="dash-stat"><span>Completed handoffs</span><strong>—</strong></div><div class="dash-stat"><span>Food quantity registered</span><strong>—</strong></div><div class="dash-stat"><span>Awaiting action</span><strong>—</strong></div></div><div class="dash-cols"><section class="card"><div class="bar" style="margin-bottom:12px"><h3>Food rescue map</h3><button class="btn o sm" data-go="map">Open full map ↗</button></div><div id="dashboard-map" class="dash-map"></div><p id="dashboard-map-status" class="mut">Loading donation locations…</p><div id="dashboard-map-list" class="stack"></div></section><div class="stack"><section class="card"><div class="bar"><h3>Recent donations</h3><button class="btn o sm" data-go="history">View history</button></div><div id="dashboard-recent">Loading donations…</div></section><section class="card"><h3>Quick actions</h3><div class="g3" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px"><button class="chip" data-go="donate">＋ Donate food</button><button class="chip" data-go="match">⇄ Find a match</button><button class="chip" data-go="schedule">◷ Arrange pickup</button><button class="chip" data-go="ai">✦ Ask AI assistant</button></div></section><section class="card"><h3>Safety first</h3><p class="mut">Food-safety eligibility is checked using explicit rules. AI urgency estimates and match recommendations never override a failed or incomplete safety review.</p></section></div></div>`},
home(){return `<header class="top">${brand(40)}<div class="links"><a data-sc="home">Home</a><a data-go="how">How it works</a><a data-go="find">Find food</a><a data-go="impact">Impact</a><a data-go="about">About</a>${user?'<button class="btn sm" data-go="dashboard">Dashboard</button>':'<button class="btn o sm" data-go="login">Login</button>'}</div></header><div class="wrap" id="home"><div class="hero"><div><h1>Good food should never <em>go to waste.</em></h1><p>RescueGrid connects surplus food with people in need, using safety checks, urgency estimates and recipient matching to help suitable food reach communities in time.</p><button class="btn" data-go="donate">Donate food →</button><button class="btn o" data-go="find">Explore donations</button></div><div class="card"><h3>Live donations <span class="mut">(from backend)</span></h3><div id="home-list"><p class="mut">Loading donations…</p></div></div></div><div class="feat"><div><span>🌱</span>Reduce food waste</div><div><span>🤝</span>Support communities</div><div><span>♻️</span>Track handoffs</div><div><span>💚</span>Measure real impact</div></div><section class="s" id="how"><h2>How it works</h2><div class="g3"><div class="card"><h3>1. Donate</h3><p class="mut">Register food, quantity, expiry, pickup window and handling information.</p></div><div class="card"><h3>2. Check & match</h3><p class="mut">Explicit safety rules run before eligible donations can be matched.</p></div><div class="card"><h3>3. Confirm handoff</h3><p class="mut">Track status through pickup and completed handoff. Only completed handoffs count as rescued.</p></div></div></section><section class="s" id="impact"><h2>Impact</h2><div id="home-impact" class="g4"><div class="card">Loading metrics…</div></div>${note}</section><section class="s" id="about"><h2>About</h2><p class="mut">RESCUEGRID is a datathon prototype. Synthetic recipient records and estimates are clearly labelled. Food safety is determined by separate rules, never by the AI.</p></section></div><footer>© 2026 RescueGrid · Analyze · Respond · Reduce waste</footer>`},
login(){return `<header class="top">${bk()}${brand(40)}</header><div class="auth"><div class="card"><div style="text-align:center;margin-bottom:14px">${logo(56)}<h3>Welcome to RescueGrid</h3><p class="mut">Prototype sign-in (not production authentication).</p></div><form id="af"><label>Your name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Demo role<select name="role"><option value="donor">Donor</option><option value="recipient">Recipient</option><option value="volunteer">Volunteer</option><option value="admin">Administrator</option></select></label><button class="btn" style="width:100%">Continue to demo</button></form><p class="mut">This prototype uses a local demo identity; it does not create a secure account.</p></div></div>`},
dashboard(){const total=donations.reduce((s,d)=>s+Number(d.quantity),0),rescued=donations.filter(d=>d.status==="completed").reduce((s,d)=>s+Number(d.quantity),0),urgent=donations.filter(d=>["safety_cleared","matched","accepted"].includes(d.status)).length;return `<div class="bar">${bk()}<h1>Welcome, ${esc(user?.name||"Coordinator")} 👋</h1><div class="who"><button class="btn sm" data-go="donate">+ Donate food</button></div></div><div class="g4"><div class="card"><span class="mut">Registered quantity</span><div class="num">${total.toFixed(1)}</div><span class="mut">Across all registered donations</span></div><div class="card"><span class="mut">Eligible / in progress</span><div class="num">${urgent}</div></div><div class="card"><span class="mut">Total donations</span><div class="num">${donations.length}</div></div><div class="card"><span class="mut">Confirmed rescued</span><div class="num">${rescued.toFixed(1)}</div><span class="mut">Completed handoffs only</span></div></div><div class="card" style="margin-top:16px"><h3>Recent donations</h3>${donations.length?donations.slice(0,8).map(d=>donationCard(d,`<button class="btn o sm" data-detail="${d.id}">Details</button>`)).join(""):'<p class="mut">No donations yet. Register the first donation.</p>'}</div>`},
donate(){return `<div class="bar">${bk()}<h1>Donate surplus food</h1></div><div class="cols"><div class="card"><form id="df"><div class="two"><label>Donor / organization name *<input name="donor_name" maxlength="100" required></label><label>Contact phone *<input name="donor_phone" maxlength="30" minlength="5" required></label></div><div class="two"><label>Food name *<input name="food_name" maxlength="100" placeholder="e.g. Vegetable rice" required></label><label>Food category *<select name="category" required>${Object.entries(CAT_LABEL).map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label></div><div class="two"><label>Quantity *<input name="quantity" type="number" min="0.1" step="0.1" required></label><label>Unit *<select name="unit"><option value="kg">kg</option><option value="portions">portions</option><option value="items">items</option></select></label></div><div class="two"><label>Prepared on (optional)<input name="prepared_on" type="date"></label><label>Pickup address *<input name="pickup_address" maxlength="200" required></label></div><div class="two"><label>Pickup time *<input name="pickup_at" type="datetime-local" required value="${dtLocal(new Date(Date.now()+30*60000))}"></label><label>Expiry time *<input name="expiry_at" type="datetime-local" required value="${dtLocal(new Date(Date.now()+3*3600000))}"></label></div><div class="two"><label>Temperature handling verified? *<select name="temperature_controlled" required><option value="">Choose…</option><option value="true">Yes</option><option value="false">No</option><option value="unknown">Not sure</option></select></label><label>Packaging intact? *<select name="packaging_intact" required><option value="">Choose…</option><option value="true">Yes</option><option value="false">No</option><option value="unknown">Not sure</option></select></label></div><label>Notes<textarea name="notes" rows="3" maxlength="500" placeholder="Ingredients, storage details, allergens…"></textarea></label><p class="mut">If a critical safety answer is missing or fails, the donation goes to safety review and cannot be matched until reviewed.</p><p id="form-error" class="err" role="alert">${esc(err)}</p><button class="btn" type="submit">Register donation</button></form></div><div class="card"><h3>Before you submit</h3><p>✓ Confirm the food is within its usable time window.</p><p>✓ Provide accurate pickup and expiry times.</p><p>✓ Answer handling questions honestly.</p><p class="mut">The backend applies human-readable safety rules. No AI model determines food safety.</p></div></div>`},
find(){return `<header class="top">${bk()}${brand(40)}<div class="links"><button class="btn sm" data-go="dashboard">Dashboard</button></div></header><div class="wrap" style="padding-top:28px"><h1 style="font-size:32px">Find donations</h1><p class="mut">Browse registered donations. Only safety-cleared food can be matched.</p><div class="card">${donations.length?donations.map(d=>donationCard(d,`<button class="btn o sm" data-detail="${d.id}">View</button>`)).join(""):'<p class="mut">No donations are registered yet.</p>'}</div></div>`},
match(){return `<div class="bar">${bk()}<h1>Smart matching</h1></div><p class="mut">Recipient profiles are synthetic demo data. Donations in safety review are excluded.</p><div class="card"><h3>Eligible donations</h3>${donations.filter(d=>["safety_cleared","matched","accepted"].includes(d.status)).length?donations.filter(d=>["safety_cleared","matched","accepted"].includes(d.status)).map(d=>donationCard(d,`<button class="btn sm" data-match="${d.id}">${d.status==="safety_cleared"?"Find recipients":"View matches"}</button>`)).join(""):'<p class="mut">No eligible donations available for matching. Register a donation with passing safety checks first.</p>'}</div><div id="match-results" class="card" style="margin-top:16px"><h3>Recipient matches</h3><p class="mut">Choose an eligible donation to view ranked recipients.</p></div>`},
recipient(){return `<div class="bar">${bk()}<h1>Recipient portal</h1></div><p class="mut">Demo recipient organizations. Capacity and demand are synthetic examples, not live partner data.</p><div id="recipient-list" class="g3">Loading recipient profiles…</div>`},
impact(){return `<div class="bar">${bk()}<h1>Impact & analytics</h1></div><div id="impact-metrics" class="g4"><div class="card">Loading metrics…</div></div><div class="card" style="margin-top:16px"><h3>Donation status breakdown</h3><div id="impact-status"></div></div><div class="card" style="margin-top:16px"><h3>Illustrative monthly trend</h3><p class="mut">Sample values for the demo presentation only — not real RESCUEGRID outcomes.</p><div class="chart">${[{m:'May',v:32},{m:'Jun',v:48},{m:'Jul',v:42},{m:'Aug',v:65},{m:'Sep',v:74},{m:'Oct',v:88}].map(x=>`<div style="height:${x.v}%"><i>${x.m}</i></div>`).join('')}</div><p class="metric-note">Illustrative sample donations per month: 32, 48, 42, 65, 74, 88.</p></div><p class="mut">Only donations marked completed count as confirmed redistributed food. CO₂ and meal conversions are not reported until a documented conversion method is configured. All sample trends are illustrative.</p>`},
ai(){return `<div class="bar">${bk()}<h1>AI assistant</h1></div><div class="card" style="max-width:720px"><p class="mut">RESCUEGRID guidance assistant. Current answers use transparent system guidance; generative-model integration requires a configured model runtime.</p><div id="chat-log"><div class="bub a">Hi! I can explain food-safety review, urgency estimates, and matching rules. I won't make food-safety decisions.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="back" data-ask="safety">Why is a donation in safety review?</button><button class="back" data-ask="matching">How does matching work?</button><button class="back" data-ask="impact">What counts as rescued food?</button></div><form id="qf" style="display:flex;gap:8px"><input name="q" placeholder="Ask about food rescue…" style="margin:0" required><button class="btn">Ask</button></form></div>`},
about(){return `<div class="bar">${bk()}<h1>About RESCUEGRID</h1></div><div class="card"><h3>Good food should reach people, not landfills.</h3><p class="page-intro">RESCUEGRID is an AI-assisted food rescue concept for connecting surplus food providers with community organizations and volunteers.</p><div class="g3"><div><h3>Rescue</h3><p class="mut">Make suitable surplus visible before its safe-use window closes.</p></div><div><h3>Coordinate</h3><p class="mut">Help donors and recipients agree on capacity and pickup timing.</p></div><div><h3>Measure</h3><p class="mut">Count completed handoffs separately from registrations and estimates.</p></div></div><p class="mut">This is a datathon implementation. Listed capacities and sample dashboard values are illustrative unless sourced from saved records.</p></div>`},
how(){return `<div class="bar">${bk()}<h1>How it works</h1></div><p class="page-intro">Three simple flows, with food safety kept separate from AI predictions.</p><div class="g3"><div class="card"><h3>1 · Donors</h3><p>Register food, quantity, preparation and expiry information, handling checks, location, and a pickup window.</p></div><div class="card"><h3>2 · Recipients</h3><p>Browse eligible donations, review details, reserve portions, and select a pickup time.</p></div><div class="card"><h3>3 · Volunteers</h3><p>Register interest and availability. Coordinate handoff details directly with the responsible organization.</p></div></div><div class="card" style="margin-top:14px"><h3>Safety first</h3><p class="mut">Missing or failed critical safety checks block matching pending review. AI urgency estimates never override these rules.</p></div>`},
contact(){return `<div class="bar">${bk()}<h1>Contact & support</h1></div><p class="page-intro">Send a question or report a problem. Requests are saved in the project database.</p><div class="card" style="max-width:760px"><form id="support-form"><div class="two"><label>Your name *<input name="name" required maxlength="100"></label><label>Email *<input name="email" type="email" required maxlength="200"></label></div><label>Subject *<input name="subject" required maxlength="160"></label><label>Message *<textarea name="message" required maxlength="3000" rows="5"></textarea></label><button class="btn">Send support request</button><p id="support-result" class="mut" role="status"></p></form></div>`},
faq(){return `<div class="bar">${bk()}<h1>Frequently asked questions</h1></div><div class="stack">${[['Who can donate?','Food providers such as kitchens, retailers, caterers, and community groups can register surplus food.'],['Does AI decide if food is safe?','No. Explicit safety checks and human review determine eligibility. AI predictions cannot override them.'],['What counts as rescued food?','Only the quantity recorded on a completed handoff counts as confirmed redistributed food.'],['Are the organizations real partners?','The current recipient profiles are synthetic demo profiles unless clearly identified as publicly listed reference organizations. No partnership is implied.'],['Are dashboard numbers real?','Stored donation and workflow metrics come from the database. Any illustrative numbers or estimates must be labelled as sample or estimated.'],['Can recipients reserve part of a donation?','The reservation workflow supports requesting a portion amount, subject to safety eligibility and quantity validation.']].map(([q,a])=>`<details class="card"><summary><b>${q}</b></summary><p class="mut">${a}</p></details>`).join('')}</div>`},
donorRegister(){return `<div class="bar">${bk()}<h1>Donor registration</h1></div><p class="page-intro">Create a demo donor profile. This stores a profile, not a secure password-based account.</p><div class="card" style="max-width:760px"><form id="donor-reg"><div class="two"><label>Contact name *<input name="name" required></label><label>Email *<input name="email" type="email" required></label></div><div class="two"><label>Organization *<input name="organization" required></label><label>Phone *<input name="phone" required></label></div><label>Location *<input name="location" required></label><button class="btn">Register donor</button></form></div>`},
recipientRegister(){return `<div class="bar">${bk()}<h1>Recipient organization registration</h1></div><p class="page-intro">Register an organization profile for the demo. Registration does not certify food-safety practices or imply external verification.</p><div class="card" style="max-width:760px"><form id="recipient-reg"><div class="two"><label>Contact name *<input name="name" required></label><label>Email *<input name="email" type="email" required></label></div><div class="two"><label>Organization *<input name="organization" required></label><label>Phone *<input name="phone" required></label></div><label>Location *<input name="location" required></label><button class="btn">Register organization</button></form></div>`},
profile(){return `<div class="bar">${bk()}<h1>User profile</h1></div><p class="page-intro">Look up and edit a saved demo profile by email. Production identity verification is not enabled.</p><div class="card" style="max-width:760px"><form id="profile-lookup"><label>Account email *<input name="email" type="email" value="${esc(user?.email||'')}" required></label><button class="btn o">Find profile</button></form><div id="profile-result" style="margin-top:16px"></div></div>`},
settings(){return `<div class="bar">${bk()}<h1>Account settings</h1></div><div class="card"><h3>Demo account settings</h3><p class="mut">This frontend does not yet use secure production authentication, password resets, or session management. Profile fields can be edited on the Profile page.</p><button class="btn o" data-go="profile">Edit profile</button><button class="btn o" data-go="login">Switch demo identity</button></div>`},
history(){return `<div class="bar">${bk()}<h1>Donation history</h1></div><p class="page-intro">Records are loaded from the API. Select a donation to inspect its details and status history.</p><div class="card">${donations.length?donations.map(d=>donationCard(d,`<button class="btn o sm" data-detail-page="${d.id}">Details & history</button>`)).join(''):'<p class="mut">No donation history yet.</p>'}</div>`},
detail(){return `<div class="bar">${bk()}<h1>Donation details</h1></div><label>Donation ID<input id="detail-id" type="number" min="1" value="${selectedDonation||''}" placeholder="Enter donation ID"></label><button class="btn" data-load-detail>Load details</button><div id="detail-result" style="margin-top:16px"></div>`},
schedule(){return `<div class="bar">${bk()}<h1>Reserve portions & schedule pickup</h1></div><p class="page-intro">Reservations are accepted only for safety-cleared donations.</p><div class="card" style="max-width:760px"><form id="reservation-form"><label>Donation *<select name="donation_id" required>${donations.filter(d=>d.status==='safety_cleared').map(d=>`<option value="${d.id}">#${d.id} · ${esc(d.food_name)} · ${esc(kg(d))}</option>`).join('')}</select></label><label>Recipient / organization name *<input name="recipient_name" required maxlength="100"></label><div class="two"><label>Portions / quantity requested *<input name="portions" type="number" min="0.1" step="0.1" required></label><label>Pickup date and time *<input name="pickup_at" type="datetime-local" required value="${dtLocal(new Date(Date.now()+60*60000))}"></label></div><button class="btn" ${donations.some(d=>d.status==='safety_cleared')?'':'disabled'}>Reserve and schedule pickup</button><p id="reservation-result" class="mut"></p></form></div>`},
tracking(){return `<div class="bar">${bk()}<h1>Pickup tracking</h1></div><div class="card">${donations.length?donations.map(d=>`<div class="act"><div style="flex:1"><b>#${d.id} · ${esc(d.food_name)}</b><div class="mut">Pickup ${esc(fmtDate(d.pickup_at))}</div></div>${badge(d.status)}</div>`).join(''):'<p class="mut">No pickups to track.</p>'}</div>`},
volunteer(){return `<div class="bar">${bk()}<h1>Volunteer with RESCUEGRID</h1></div><p class="page-intro">Register your availability to help coordinate food rescue. This form records interest; it does not automatically assign deliveries.</p><div class="card" style="max-width:760px"><form id="volunteer-form"><div class="two"><label>Name *<input name="name" required></label><label>Email *<input name="email" type="email" required></label></div><label>Availability *<select name="availability" required><option value="">Choose availability</option><option>Weekdays</option><option>Weekends</option><option>Flexible</option><option>Evenings</option></select></label><label>Skills or notes<textarea name="skills" rows="3" maxlength="500"></textarea></label><button class="btn">Register volunteer interest</button><p id="volunteer-result" class="mut"></p></form></div>`},
map(){return `<div class="bar">${bk()}<h1>Food rescue map</h1></div><p class="page-intro">Interactive OpenStreetMap view. Pins are added only when the address lookup returns coordinates; verify locations before using them for collection.</p><div class="card"><div id="rescue-map" style="height:360px;border-radius:12px;overflow:hidden;background:var(--g2)"></div><p id="map-status" class="mut">Preparing map…</p><div id="map-locations" class="stack"></div></div>`},
insights(){return `<div class="bar">${bk()}<h1>AI insights</h1></div><p class="page-intro">Shows a transparent time-to-expiry baseline alongside a DecisionTree trained and evaluated on synthetic examples. Neither method determines food safety.</p><div class="card"><h3>Urgency estimates</h3><div id="urgency-results">Loading insights…</div></div><div class="card" style="margin-top:14px"><h3>Generative AI assistance</h3><p class="mut">The assistant calls a configured OpenAI-compatible model endpoint when one is provided. Without configuration, it clearly falls back to rule-based guidance rather than pretending to generate model output.</p><button class="btn o" data-go="ai">Open assistant</button></div>`},
admin(){return `<div class="bar">${bk()}<h1>Admin workspace</h1></div><p class="page-intro">Demo management view. The current API is not protected by production authentication; do not expose it publicly as an admin system.</p><div id="admin-content" class="stack">Loading users, donations and organizations…</div>`},
resources(){return `<div class="bar">${bk()}<h1>Food rescue guidance</h1></div><div class="g3"><div class="card"><h3>Handling & safety</h3><p class="mut">Record preparation time, expiry, storage conditions, packaging integrity, allergens, and pickup constraints accurately. Follow local food-safety rules.</p></div><div class="card"><h3>Recipient coordination</h3><p class="mut">Confirm category compatibility, quantities, recipient capacity, pickup windows, and contact details before handoff.</p></div><div class="card"><h3>Impact reporting</h3><p class="mut">Count only completed handoffs as confirmed redistribution. Label meal equivalents and waste-avoidance conversions as estimates with a documented method.</p></div></div><div class="card" style="margin-top:14px"><h3>Public reference organizations</h3><p class="mut">No organization is represented as a RESCUEGRID partner without verification. Use official public organization websites when adding reference names.</p><p><a href="https://www.unep.org/" target="_blank" rel="noopener">United Nations Environment Programme (UNEP)</a> · <a href="https://www.wfp.org/" target="_blank" rel="noopener">World Food Programme (WFP)</a> · <a href="https://www.fao.org/" target="_blank" rel="noopener">Food and Agriculture Organization of the United Nations (FAO)</a></p><p class="mut">These are real UN-system organizations, shown as public references only, not as partners or food donation providers in this demo.</p></div>`}
};
function render(){if(page==="admin"&&user?.role!=="admin"){page="dashboard";notify("Admin view requires the administrator demo role.",true)}const app=$("#app");document.title="RescueGrid | "+(page==="home"?"AI-powered food rescue":page);if(["home","login","find"].includes(page)){app.innerHTML=P[page]()}else{app.innerHTML=`<div class="shell"><aside>${brand(36)}<nav aria-label="Main">
<div class="nav-group"><button class="group-toggle" data-group-toggle="overview" aria-expanded="${["dashboard","impact","map"].includes(page)?"true":"false"}"><span><span class="group-icon">▦</span>Overview</span><span class="chev">›</span></button><div class="group-items" data-group="overview" ${["dashboard","impact","map"].includes(page)?"":"hidden"}><button data-go="dashboard" class="${page==="dashboard"?"on":""}">Dashboard</button><button data-go="impact" class="${page==="impact"?"on":""}">Impact & analytics</button><button data-go="map" class="${page==="map"?"on":""}">Map & locations</button></div></div>
<div class="nav-group"><button class="group-toggle" data-group-toggle="food" aria-expanded="${["donate","find","match","recipient","history","schedule","tracking"].includes(page)?"true":"false"}"><span><span class="group-icon">♧</span>Food rescue</span><span class="chev">›</span></button><div class="group-items" data-group="food" ${["donate","find","match","recipient","history","schedule","tracking"].includes(page)?"":"hidden"}><button data-go="donate" class="${page==="donate"?"on":""}">Donate food</button><button data-go="find" class="${page==="find"?"on":""}">Find food</button><button data-go="match" class="${page==="match"?"on":""}">Smart matching</button><button data-go="recipient" class="${page==="recipient"?"on":""}">Recipient portal</button><button data-go="history" class="${page==="history"?"on":""}">Donation history</button><button data-go="schedule" class="${page==="schedule"?"on":""}">Reserve / pickup</button><button data-go="tracking" class="${page==="tracking"?"on":""}">Pickup tracking</button></div></div>
<div class="nav-group"><button class="group-toggle" data-group-toggle="ai" aria-expanded="${["ai","insights"].includes(page)?"true":"false"}"><span><span class="group-icon">✦</span>AI tools</span><span class="chev">›</span></button><div class="group-items" data-group="ai" ${["ai","insights"].includes(page)?"":"hidden"}><button data-go="ai" class="${page==="ai"?"on":""}">AI assistant</button><button data-go="insights" class="${page==="insights"?"on":""}">AI insights</button></div></div>
<div class="nav-group"><button class="group-toggle" data-group-toggle="community" aria-expanded="${["volunteer","resources","about","how","faq","contact"].includes(page)?"true":"false"}"><span><span class="group-icon">♡</span>Community</span><span class="chev">›</span></button><div class="group-items" data-group="community" ${["volunteer","resources","about","how","faq","contact"].includes(page)?"":"hidden"}><button data-go="volunteer" class="${page==="volunteer"?"on":""}">Volunteers</button><button data-go="resources" class="${page==="resources"?"on":""}">Food rescue guidance</button><button data-go="about" class="${page==="about"?"on":""}">About</button><button data-go="how" class="${page==="how"?"on":""}">How it works</button><button data-go="faq" class="${page==="faq"?"on":""}">FAQ</button><button data-go="contact" class="${page==="contact"?"on":""}">Support</button></div></div>
<div class="nav-group"><button class="group-toggle" data-group-toggle="account" aria-expanded="${["profile","settings","donorRegister","recipientRegister","admin"].includes(page)?"true":"false"}"><span><span class="group-icon">⚙</span>Account & admin</span><span class="chev">›</span></button><div class="group-items" data-group="account" ${["profile","settings","donorRegister","recipientRegister","admin"].includes(page)?"":"hidden"}><button data-go="profile" class="${page==="profile"?"on":""}">Profile</button><button data-go="settings" class="${page==="settings"?"on":""}">Settings</button><button data-go="donorRegister" class="${page==="donorRegister"?"on":""}">Donor registration</button><button data-go="recipientRegister" class="${page==="recipientRegister"?"on":""}">Recipient registration</button><button data-go="admin" class="${page==="admin"?"on":""}">Admin</button></div></div>
</nav><button class="back out" data-out>Log out</button></aside><div class="main">${P[page]?P[page]():"<h1>Page not found</h1>"}</div></div>`}hydratePage().catch(e=>notify(e.message,true))}
async function hydrateDonationMap(mapId,statusId,listId){const mapEl=$("#"+mapId),status=$("#"+statusId),list=$("#"+listId);if(!mapEl||!status||!list)return;list.innerHTML="";if(!window.L){status.textContent="Map library could not load. The location list is still available.";list.innerHTML=donations.map(d=>`<div class="act"><div><b>${esc(d.food_name)}</b><div class="mut">${esc(d.pickup_address||"No pickup address recorded")}</div></div>${badge(d.status)}</div>`).join("")||'<p class="mut">No donations yet.</p>';return}const map=L.map(mapId).setView([20,0],2);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);status.textContent="Loading pickup locations. Only successfully geocoded addresses get map pins.";let pins=0;for(const d of donations){const address=(d.pickup_address||"").trim();list.insertAdjacentHTML("beforeend",`<div class="act"><div style="flex:1"><b>${esc(d.food_name)}</b><div class="mut">${esc(address||"No pickup address recorded")}</div></div>${badge(d.status)}</div>`);if(!address)continue;try{const response=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(address));if(!response.ok)continue;const results=await response.json();if(results[0]){const lat=Number(results[0].lat),lon=Number(results[0].lon);L.marker([lat,lon]).addTo(map).bindPopup(`<b>${esc(d.food_name)}</b><br>${esc(address)}<br>${esc(STATUS_LABEL[d.status]||d.status)}`);pins++;if(pins===1)map.setView([lat,lon],11)}}catch{}}status.textContent=`${pins} of ${donations.length} donation locations mapped. Verify addresses before travel; public geocoding may be unavailable.`;setTimeout(()=>map.invalidateSize(),100)}
async function hydratePage(){if(page==="dashboard"){const impact=await api("/impact");const pending=Number(impact.status_counts?.safety_review||0)+Number(impact.status_counts?.registered||0);$("#dash-metrics").innerHTML=`<div class="dash-stat"><span>Registered donations</span><strong>${Number(impact.registered_donations||0).toLocaleString()}</strong><span>Saved in the database</span></div><div class="dash-stat"><span>Completed handoffs</span><strong>${Number(impact.completed_handoffs||0).toLocaleString()}</strong><span>Confirmed only</span></div><div class="dash-stat"><span>Quantity registered</span><strong>${Number(impact.quantity_registered||0).toLocaleString()}</strong><span>Mixed units; not kilograms</span></div><div class="dash-stat"><span>Awaiting action</span><strong>${pending}</strong><span>New or safety review</span></div>`;$("#dashboard-recent").innerHTML=donations.slice(0,5).map(d=>donationCard(d)).join("")||'<p class="mut">No donations yet. Add the first donation to get started.</p>';await hydrateDonationMap("dashboard-map","dashboard-map-status","dashboard-map-list")}
if(page==="home"){const list=$("#home-list");list.innerHTML=donations.slice(0,4).map(d=>donationCard(d)).join("")||'<p class="mut">No donations have been registered yet.</p>';try{const m=await api("/impact");$("#home-impact").innerHTML=metricCards(m)}catch{$("#home-impact").innerHTML='<div class="card">Impact metrics unavailable</div>'}}
if(page==="recipient"){const r=await api("/recipients");$("#recipient-list").innerHTML=r.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p class="mut">${esc(x.type)} · ${esc(x.location)}</p><div class="num">${Object.values(x.capacity_by_unit||{}).join(" / ")}</div><p class="mut">Synthetic capacity (kg / portions / items) · ${x.current_demand} current demand index</p><span class="pill">${x.pickup_available?"Pickup available":"Pickup unavailable"}</span></div>`).join("")}
if(page==="impact"){const m=await api("/impact");$("#impact-metrics").innerHTML=metricCards(m);$("#impact-status").innerHTML=Object.entries(m.status_counts||{}).map(([s,n])=>`<div class="act"><span>${esc(STATUS_LABEL[s]||s)}</span><b style="margin-left:auto">${n}</b></div>`).join("")||'<p class="mut">No status data yet.</p>';const counts=Object.entries(m.status_counts||{});if(counts.length){$("#impact-status").insertAdjacentHTML('beforeend',`<div class="chart">${counts.map(([k,v])=>`<div style="height:${Math.max(5,Math.min(100,Number(v)*15))}%"><i>${esc(STATUS_LABEL[k]||k)}</i></div>`).join('')}</div>`);}}
if(page==="map"){await hydrateDonationMap("rescue-map","map-status","map-locations")}

if(page==="insights"){const x=await api('/ai/insights');const el=$('#urgency-results');el.innerHTML=x.urgency_predictions.length?x.urgency_predictions.map(a=>`<div class="act"><div style="flex:1"><b>#${a.donation_id} · ${esc(a.food_name)}</b><div class="mut">${a.hours_until_expiry} hours until expiry · transparent baseline</div></div><span class="pill">${esc(a.urgency)}</span></div>`).join(''):'<p class="mut">No safety-cleared donations available for urgency estimates.</p>';el.insertAdjacentHTML('beforeend',`<p class="mut">${esc(x.method_note)}</p><h3>Decision-tree predictions</h3>${(x.model_predictions||[]).map(a=>`<div class="act"><div style="flex:1"><b>#${a.donation_id} · ${esc(a.food_name)}</b><div class="mut">${a.hours_until_expiry} hours until expiry · low ${a.probabilities.low}, medium ${a.probabilities.medium}, high ${a.probabilities.high}</div></div><span class="pill">${esc(a.prediction)}</span></div>`).join('')||'<p class="mut">No safety-cleared donations available for the model prediction.</p>'}<p class="mut">Synthetic test macro-F1: ${x.model_metrics?.macro_f1??'—'} · ${esc(x.model_metrics?.warning||'')}</p>`) }
if(page==="admin"){const x=await api('/admin/overview');$('#admin-content').innerHTML=`<div class="g3"><div class="card"><span class="mut">Saved users</span><div class="num">${x.users.length}</div></div><div class="card"><span class="mut">Donations</span><div class="num">${x.donations.length}</div></div><div class="card"><span class="mut">Organizations</span><div class="num">${x.organizations.length}</div></div></div><div class="card"><h3>Users & organizations</h3>${x.users.length?`<table class="small-table"><tr><th>Name</th><th>Role</th><th>Organization</th><th>Email</th></tr>${x.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.organization||'—')}</td><td>${esc(u.email)}</td></tr>`).join('')}</table>`:'<p class="mut">No registered profiles yet.</p>'}</div><div class="card"><h3>Donation records</h3>${x.donations.length?x.donations.map(d=>donationCard(d,`<button class="btn o sm" data-detail="${d.id}">Details</button>`)).join(''):'<p class="mut">No donations yet.</p>'}</div><div class="card"><h3>Support requests</h3>${x.support_requests.length?x.support_requests.map(r=>`<div class="act"><div><b>${esc(r.subject)}</b><div class="mut">${esc(r.name)} · ${esc(r.email)} · ${esc(r.status)}</div></div></div>`).join(''):'<p class="mut">No support requests yet.</p>'}<p class="mut">${esc(x.data_mode)}</p></div>`}
if(page==="detail" && selectedDonation){$('#detail-id').value=selectedDonation;loadDonationDetail(selectedDonation)}}
function metricCards(m){return `<div class="card"><span class="mut">Registered donations</span><div class="num">${m.registered_donations}</div></div><div class="card"><span class="mut">Quantity registered</span><div class="num">${Number(m.quantity_registered).toFixed(1)}</div><span class="mut">Mixed units; do not sum as kg</span></div><div class="card"><span class="mut">Completed handoffs</span><div class="num">${m.completed_handoffs}</div></div><div class="card"><span class="mut">Confirmed quantity</span><div class="num">${Number(m.quantity_completed).toFixed(1)}</div><span class="mut">Completed handoffs only; mixed units</span></div>`}
async function loadDonationDetail(id){const d=await api(`/donations/${id}`);const events=await api(`/donations/${id}/history`);const reservations=await api(`/donations/${id}/reservations`).catch(()=>[]);const el=$('#detail-result');if(!el)return;el.innerHTML=`<div class="card"><h3>${esc(d.food_name)}</h3><div class="statusline">${badge(d.status)} <span class="mut">Donation #${d.id}</span></div><p>${esc(CAT_LABEL[d.category]||d.category)} · ${esc(kg(d))}</p><p><b>Donor:</b> ${esc(d.donor_name)} · ${esc(d.donor_phone)}</p><p><b>Pickup:</b> ${esc(fmtDate(d.pickup_at))} · ${esc(d.pickup_address)}</p><p><b>Expiry:</b> ${esc(fmtDate(d.expiry_at))}</p><h3>Food-safety checks</h3><p class="mut">Temperature handling: ${d.temperature_controlled===true?'verified yes':d.temperature_controlled===false?'reported no':'unknown / missing'} · Packaging: ${d.packaging_intact===true?'intact':d.packaging_intact===false?'reported damaged':'unknown / missing'}</p><p class="mut">${esc(d.safety_note||'No safety note recorded.')}</p><h3>Status history</h3>${events.map(e=>`<div class="act"><div><b>${esc(STATUS_LABEL[e.to_status]||e.to_status)}</b><div class="mut">${esc(e.changed_at)} · ${esc(e.reason||'Status recorded')}</div></div></div>`).join('')||'<p class="mut">No status events.</p>'}<h3>Reservations</h3>${reservations.map(r=>`<div class="act"><div><b>${esc(r.recipient_name)}</b><div class="mut">${r.portions} requested · ${esc(fmtDate(r.pickup_at))} · ${esc(r.status)}</div></div></div>`).join('')||'<p class="mut">No reservations.</p>'}<button class="btn o" data-go="schedule">Reserve portions</button></div>`}
async function reloadAndRender(){await refresh();render()}
document.addEventListener("click",async e=>{const t=e.target.closest("button,a,[data-close]");if(!t)return;const d=t.dataset;
try{
if(d.groupToggle){const group=document.querySelector(`[data-group="${d.groupToggle}"]`);if(group){const expanded=t.getAttribute("aria-expanded")==="true";t.setAttribute("aria-expanded",String(!expanded));group.hidden=expanded;}return}
if(d.close!==undefined&&e.target===t){modal();return}if(d.x!==undefined){modal();return}
if(d.go){go(d.go);return}if(d.back!==undefined){back();return}
if(d.sc){if(page!=="home"){page="home";render()}setTimeout(()=>document.getElementById(d.sc)?.scrollIntoView(),0);return}
if(d.out!==undefined){user=null;page="home";stack=[];render();return}
if(d.review){modal(`<h3>Human safety review</h3><p class="mut">Review the actual handling information before approving or rejecting. Do not approve without verification.</p><label style="text-align:left">Review reason<input id="review-reason" maxlength="300" placeholder="What was checked?" required></label><button class="btn" data-review-action="${d.review}" data-next="safety_cleared">Approve after verification</button><button class="btn o" data-review-action="${d.review}" data-next="rejected_unsafe">Reject as unsafe</button><button class="back" data-x>Cancel</button>`);return}
if(d.reviewAction){const reason=$("#review-reason")?.value.trim();if(!reason){notify("Enter a review reason first.",true);return}await api(`/donations/${d.reviewAction}/status`,{method:"PATCH",body:JSON.stringify({status:d.next,reason})});modal();notify("Safety review recorded.");await reloadAndRender();return}
if(d.detail){const item=await api(`/donations/${d.detail}`);modal(`<h3>${esc(item.food_name)}</h3><p>${esc(CAT_LABEL[item.category]||item.category)} · ${esc(kg(item))}</p><p>${esc(item.donor_name)} · ${esc(item.pickup_address)}</p><p>Pickup: ${esc(fmtDate(item.pickup_at))}<br>Expiry: ${esc(fmtDate(item.expiry_at))}</p><p>${badge(item.status)}</p><p class="mut">${esc(item.safety_note||"No safety issues recorded.")}</p><button class="btn" data-x>Close</button>`);return}
if(d.match){selectedDonation=Number(d.match);const result=await api(`/match-recipients/${selectedDonation}`);$("#match-results").innerHTML=`<h3>Ranked recipient matches</h3>${result.matches.length?result.matches.map(m=>`<div class="act"><div style="flex:1"><b>${esc(m.recipient.name)}</b><div class="mut">${esc(m.recipient.type)} · ${esc(m.recipient.location)}</div><div class="mut">${esc(m.reason)}</div><span class="pill">${m.score}% match</span></div>${result.donation.status==="safety_cleared"?`<button class="btn sm" data-choose="${selectedDonation}" data-recipient="${m.recipient.id}">Select</button>`:""}</div>`).join(""):'<p class="mut">No recipient passed the capacity, category and pickup constraints.</p>'}${result.donation.status==="matched"?`<button class="btn sm" data-status="${selectedDonation}" data-next="accepted">Confirm recipient acceptance</button>`:""}`;return}
if(d.choose){const id=Number(d.choose);await api(`/donations/${id}/match`,{method:"POST",body:JSON.stringify({recipient_id:Number(d.recipient)})});notify("Recipient match recorded.");await reloadAndRender();if(page==="match"){const b=document.querySelector(`[data-match="${id}"]`);if(b)b.click()}return}
if(d.status){const id=Number(d.status),next=d.next;await api(`/donations/${id}/status`,{method:"PATCH",body:JSON.stringify({status:next})});notify("Status updated: "+(STATUS_LABEL[next]||next));await reloadAndRender();return}
if(d.detailPage){selectedDonation=Number(d.detailPage);page='detail';stack.push('history');render();return}
if(d.loadDetail!==undefined){const id=Number($('#detail-id')?.value);if(!id){notify('Enter a donation ID.',true);return}selectedDonation=id;await loadDonationDetail(id);return}
if(d.go==='profile' && !user){go('profile');return}
if(d.ask){const q=d.ask==="safety"?"A donation enters safety review when required handling information is missing, a check fails, or the expiry time has passed. A human must review it before matching.":d.ask==="matching"?"Only safety-cleared donations are eligible. The prototype filters recipients by category compatibility, capacity and pickup availability, then ranks the remaining candidates.":"Only a completed handoff counts as confirmed redistribution. Registered donations and accepted matches are not counted as rescued.";$("#chat-log").insertAdjacentHTML("beforeend",`<div class="bub u">${esc(d.ask)}</div><div class="bub a">${esc(q)}</div>`);return}
}catch(error){notify(error.message,true)}
});
document.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
try{
if(e.target.id==="af"){user={name:f.name.trim(),email:f.email.trim(),role:f.role||"donor"};page="dashboard";stack=[];await refresh();render();notify("Demo session started. This is not production authentication.");return}
if(e.target.id==="df"){
 const prepared = /^\d{4}-\d{2}-\d{2}$/.test(f.prepared_on || "") ? f.prepared_on : null;
 const payload = {
   donor_name: f.donor_name,
   donor_phone: f.donor_phone,
   food_name: f.food_name,
   category: f.category,
   quantity: Number(f.quantity),
   unit: f.unit,
   prepared_on: prepared,
   pickup_address: f.pickup_address,
   expiry_at: new Date(f.expiry_at).toISOString(),
   pickup_at: new Date(f.pickup_at).toISOString(),
   temperature_controlled: f.temperature_controlled === "unknown" ? null : f.temperature_controlled === "true",
   packaging_intact: f.packaging_intact === "unknown" ? null : f.packaging_intact === "true",
   notes: f.notes || null
 };
 const d=await api("/donations",{method:"POST",body:JSON.stringify(payload)});await refresh();page="dashboard";stack=[];render();notify(`Donation #${d.id} registered: ${STATUS_LABEL[d.status]}.`);return}
if(e.target.id==='donor-reg'||e.target.id==='recipient-reg'){const route=e.target.id==='donor-reg'?'/registrations/donor':'/registrations/recipient';const x=await api(route,{method:'POST',body:JSON.stringify(f)});notify(`Profile #${x.id} registered. Demo profile only; secure authentication is not enabled.`);user={name:x.name,email:x.email,role:x.role,id:x.id};page='profile';stack=[];render();return}
if(e.target.id==='support-form'){const x=await api('/support',{method:'POST',body:JSON.stringify(f)});$('#support-result').textContent=`Support request #${x.id} saved with status: ${x.status}.`;e.target.reset();return}
if(e.target.id==='volunteer-form'){const x=await api('/volunteers',{method:'POST',body:JSON.stringify(f)});$('#volunteer-result').textContent=`Volunteer interest #${x.id} saved.`;e.target.reset();return}
if(e.target.id==='reservation-form'){const payload={...f,donation_id:Number(f.donation_id),portions:Number(f.portions),pickup_at:new Date(f.pickup_at).toISOString()};const x=await api('/reservations',{method:'POST',body:JSON.stringify(payload)});$('#reservation-result').textContent=`Reservation #${x.id} saved. Pickup: ${fmtDate(x.pickup_at)}.`;notify('Reservation saved.');return}
if(e.target.id==='profile-lookup'){const all=await api('/users');const match=all.find(x=>x.email.toLowerCase()===f.email.trim().toLowerCase());const out=$('#profile-result');if(!match){out.innerHTML='<p class="mut">No profile found for that email.</p>';return}user={name:match.name,email:match.email,role:match.role,id:match.id};out.innerHTML=`<form id="profile-edit"><input type="hidden" name="id" value="${match.id}"><label>Name<input name="name" value="${esc(match.name)}" required></label><label>Phone<input name="phone" value="${esc(match.phone||'')}"></label><label>Organization<input name="organization" value="${esc(match.organization||'')}"></label><label>Location<input name="location" value="${esc(match.location||'')}"></label><button class="btn">Save profile</button></form><p class="mut">Role: ${esc(match.role)} · Profile ID: ${match.id}</p>`;return}
if(e.target.id==='profile-edit'){const id=Number(f.id);delete f.id;const x=await api(`/users/${id}`,{method:'PATCH',body:JSON.stringify(f)});notify('Profile updated.');$('#profile-result').insertAdjacentHTML('beforeend',`<p class="ok">Saved at ${esc(x.created_at)} (profile creation time).</p>`);return}
if(e.target.id==="qf"){const q=f.q.trim();$('#chat-log').insertAdjacentHTML('beforeend',`<div class="bub u">${esc(q)}</div><div class="bub a">Thinking…</div>`);const bubbles=$('#chat-log').querySelectorAll('.bub.a');const target=bubbles[bubbles.length-1];try{const result=await api('/ai/assistant',{method:'POST',body:JSON.stringify({question:q})});target.textContent=result.answer+(result.generated?'':' (fallback guidance; generative model not active)')}catch(error){target.textContent='Assistant unavailable: '+error.message}e.target.reset();return}
}catch(error){const el=$("#form-error");if(el)el.textContent=error.message;else notify(error.message,true)}
});
async function start(){try{await refresh()}catch{}render();try{const h=await api("/health");if(h.status!=="ok")notify("Backend health check is degraded.",true)}catch{notify("Cannot reach the RESCUEGRID API. Open this page through the FastAPI server, not as a local file.",true)}}
start();
</script>
</body>
</html>
